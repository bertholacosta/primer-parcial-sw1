acceptance_criteria:
  - "kiro-cli se invoca con --agent-engine v3 cuando se usa --output-format stream-json."
  - "El adaptador Devin emite --permission-mode, --respect-workspace-trust, --prompt-file, --export y --print antes de cualquier PATH o separador --."
  - "El preflight ejecuta comprobaciones de parseo no destructivas contra las versiones instaladas de kiro-cli y devin."
  - "Los fallos de infraestructura (autenticación, cuota, argumentos inválidos, proceso no iniciado, engine incompatible, transporte inválido) pausan en paused-agent-error sin incrementar correctionCount y conservan stdout, stderr, exitCode, argumentos, versión del CLI y ruta del log."
  - "La adopción sin entregables ni cambios reales comienza en executing con el prompt inicial; con entregables comienza en validating."
  - "resume restablece correctionCount a cero solo cuando todos los intentos previos fueron infraestructura, conservando historial, logs, rama y worktree."
  - "Las pruebas nuevas cubren los dieciséis casos obligatorios y el límite de dos correcciones funcionales se mantiene."

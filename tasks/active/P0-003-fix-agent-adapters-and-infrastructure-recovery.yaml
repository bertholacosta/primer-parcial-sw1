constraints:
  - "Usar Windows 11 y PowerShell 7; no usar WSL, bash, grep, find ni test."
  - "No inventar comandos o flags de CLIs; basarse en --version y --help instalados."
  - "No modificar archivos de P1-001 ni generar docs/contracts/domain-model-v1.md."

  Corregir la invocación de kiro-cli (engine v3 con stream-json), el orden de
  argumentos del adaptador Devin (todas las opciones antes de cualquier PATH o
  separador --), la clasificación de fallos de infraestructura sin consumir
  correcciones funcionales, la adopción en executing cuando no hay entregables
  y la recuperación mediante resume tras corregir la causa de infraestructura.

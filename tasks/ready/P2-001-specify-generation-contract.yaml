id: P2-001
title: "Especificar contrato de generación determinista"
phase: 2
status: ready
kind: specification
owner_role: Kiro
objective: "Definir entradas, salidas, errores, manifiesto, orden y criterio de reproducibilidad del generador y del descriptor Flutter."
dependencies:
  - P1-004
inputs:
  files:
    - docs/contracts/domain-model-v1.md
    - docs/ARCHITECTURE.md
  docs:
    - docs/contracts/README.md
scope:
  allowed_paths:
    - docs/contracts/generator-input-output-v1.md
    - docs/contracts/flutter-descriptor-v1.md
  forbidden_paths:
    - apps/
    - services/
    - packages/
    - templates/
    - fixtures/
acceptance_criteria:
  - "Define las cinco capas obligatorias, JPA/Hibernate, PostgreSQL y reglas de nombres sin seleccionar engine."
  - "Define reproducibilidad byte a byte o normalización explícita, errores atómicos y trazabilidad del descriptor al modelo."
validation_commands:
  - "git diff --check -- docs/contracts/generator-input-output-v1.md docs/contracts/flutter-descriptor-v1.md"
  - "Select-String -Pattern 'Controller|Service|Repository|Entity|DTO|determin|descriptor' docs/contracts/generator-input-output-v1.md,docs/contracts/flutter-descriptor-v1.md"
deliverables:
  - docs/contracts/generator-input-output-v1.md
  - docs/contracts/flutter-descriptor-v1.md
links:
  - docs/adr/0000-foundational-decisions.md

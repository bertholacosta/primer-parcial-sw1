    - apps/mobile-flutter/
  forbidden_paths:
    - apps/case-web/
    - services/
    - packages/
    - templates/
    - fixtures/
acceptance_criteria:
  - "Una transcripción de prueba produce la propuesta esperada con origen y confianza."
  - "Aceptar exige validación; rechazar no altera el modelo; no requiere red en la prueba del adaptador."
validation_commands:
  - "git diff --check -- apps/mobile-flutter"
  - "Push-Location apps/mobile-flutter; flutter analyze; Pop-Location"
  - "Push-Location apps/mobile-flutter; flutter test; Pop-Location"
deliverables:
  - apps/mobile-flutter/
links:
  - docs/contracts/multimodal-proposals-v1.md

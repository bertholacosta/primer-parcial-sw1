id: P7-002
title: "Agregar adaptador de propuestas de voz"
phase: 7
status: ready
kind: implementation
owner_role: Devin CLI / SWE-2
objective: "Convertir una transcripción inyectada en una propuesta confirmable, sin escoger todavía reconocimiento local."
dependencies:
  - P7-001
  - P3-003
inputs:
  files:
    - docs/contracts/multimodal-proposals-v1.md
  docs:
    - docs/contracts/model-commands-v1.md
scope:

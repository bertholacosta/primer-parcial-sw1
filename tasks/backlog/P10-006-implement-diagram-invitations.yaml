id: P10-006
title: "Implementar invitaciones por correo y enlace"
phase: 10
status: backlog
kind: implementation
owner_role: Devin CLI / SWE-2
objective: >-
  Permitir que el owner invite por correo o cree enlaces con rol, expiración y
  revocación, y que un usuario autenticado los canjee de forma idempotente.
dependencies: [P10-005]
inputs:
  files:
    - docs/contracts/identity-access-v1.md
  docs:

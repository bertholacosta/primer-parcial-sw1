acceptance_criteria:
  - "Una entrada inválida no deja salida parcial y devuelve error estable."
  - "El plan de archivos tiene orden estable y rechaza rutas fuera del destino."
validation_commands:
  - "git diff --check -- services/generator-cli packages/domain-model packages/domain-validator"
  - "npm install --prefix services/generator-cli"
  - "npm run build --prefix services/generator-cli"
  - "npm run test --prefix services/generator-cli"
deliverables:
  - services/generator-cli/
links:
  - docs/adr/0002-generator-implementation.md
  - "scope and validation_commands passed"
  - "independent reviewer approved normalized JSON"
  - "integrator approved normalized JSON"

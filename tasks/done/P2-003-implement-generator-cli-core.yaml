id: P2-003
title: "Implementar núcleo seguro del generator CLI"
phase: 2
status: done
kind: implementation
owner_role: Devin
objective: "Implementar lectura, validación, planificación ordenada y escritura atómica sin generar aún las cinco capas."
dependencies:
  - P2-002
inputs:

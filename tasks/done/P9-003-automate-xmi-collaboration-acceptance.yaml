id: P9-003
title: "Automatizar aceptación XMI y colaboración"
phase: 9
status: done
kind: test
owner_role: Devin CLI / SWE-2
objective: "Ejecutar round-trip XMI y convergencia de dos clientes sobre fixtures versionados."
dependencies: [P5-003, P6-003]
inputs:
  files: [docs/contracts/xmi-profile-v1.md, docs/contracts/collaboration-protocol-v1.md]
  docs: [docs/ARCHITECTURE.md]
scope:
  allowed_paths: [scripts/, fixtures/xmi/, packages/xmi-adapter/, packages/collaboration-protocol/, services/model-server/]
  forbidden_paths: [apps/, services/generator-cli/, templates/, fixtures/generated-projects/]
acceptance_criteria:
  - "El round-trip conserva equivalencia semántica del corpus soportado."
  - "La traza concurrente y la reconexión terminan en modelos equivalentes sin duplicados."
validation_commands:
  - "git diff --check -- scripts fixtures/xmi packages/xmi-adapter packages/collaboration-protocol services/model-server"
  - "Push-Location packages/xmi-adapter; npm test; Pop-Location"
  - "Push-Location packages/collaboration-protocol; npm test; Pop-Location"
  - "Push-Location services/model-server; npm test; Pop-Location"
  - "pwsh -File scripts/validate-xmi-collaboration.ps1"
deliverables: [scripts/, fixtures/xmi/]
links: [docs/contracts/xmi-profile-v1.md, docs/contracts/collaboration-protocol-v1.md]
  - "scope and validation_commands passed"
  - "independent reviewer approved normalized JSON"
  - "integrator approved normalized JSON"
